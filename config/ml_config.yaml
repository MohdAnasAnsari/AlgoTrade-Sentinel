# AlgoTrade Sentinel — ML configuration
# All thresholds, hyperparameters, and seeds live here.
# Import via: yaml.safe_load(open("config/ml_config.yaml"))

# ── Reproducibility ────────────────────────────────────────────────────────
seed: 42

# ── Signal generation ──────────────────────────────────────────────────────
inference:
  confidence_threshold: 0.55      # min max(proba) to emit a signal
  feature_limit: 500              # max rows of features to load per ticker

# ── Model registry ────────────────────────────────────────────────────────
registry:
  auto_promote_f1_delta: 0.01     # challenger must beat champion F1 by this margin
  champion_stage: "Production"
  challenger_stage: "Staging"

# ── Label engineering ─────────────────────────────────────────────────────
labels:
  forward_window_days: 5          # future return window for labelling
  buy_threshold: 0.02             # return > buy_threshold → BUY
  sell_threshold: -0.02           # return < sell_threshold → SELL
  order: ["BUY", "HOLD", "SELL"]  # fixed label order for LabelEncoder

# ── Feature engineering ───────────────────────────────────────────────────
features:
  sma_windows: [10, 20, 50, 200]
  ema_windows: [10, 20, 50]
  rsi_period: 14
  adx_period: 14
  atr_period: 14
  bb_period: 20
  stoch_period: 14
  roc_period: 10
  cmf_period: 20
  vol_sma_period: 20
  hist_vol_period: 20

# ── Training ──────────────────────────────────────────────────────────────
training:
  n_optuna_trials: 20
  tscv_n_splits: 5
  optuna_targets:
    - RandomForestClassifier
    - LGBMClassifier
    - XGBClassifier
  default_models:
    - LogisticRegression
    - DecisionTreeClassifier
    - RandomForestClassifier
    - GradientBoostingClassifier

# ── Default hyperparameters ───────────────────────────────────────────────
model_defaults:
  LogisticRegression:
    max_iter: 1000
    solver: lbfgs
    multi_class: multinomial

  DecisionTreeClassifier:
    max_depth: 8

  RandomForestClassifier:
    n_estimators: 200
    n_jobs: -1

  GradientBoostingClassifier:
    n_estimators: 100

  XGBClassifier:
    n_estimators: 100
    eval_metric: mlogloss
    verbosity: 0

  LGBMClassifier:
    n_estimators: 100
    verbose: -1

  CatBoostClassifier:
    iterations: 100
    verbose: 0

# ── Optuna HPO search spaces ──────────────────────────────────────────────
hpo:
  RandomForestClassifier:
    n_estimators: [50, 200]
    max_depth: [3, 15]
    min_samples_split: [2, 20]
    min_samples_leaf: [1, 10]
    max_features: [sqrt, log2]

  LGBMClassifier:
    n_estimators: [50, 200]
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3]
    num_leaves: [20, 80]
    min_child_samples: [5, 50]

  XGBClassifier:
    n_estimators: [50, 200]
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]

# ── Monitoring ────────────────────────────────────────────────────────────
monitoring:
  drift_threshold: 0.15           # drift_share above this triggers alert
  performance_degradation_pct: 10 # F1 drop % that triggers retrain
  retrain_cooldown_days: 7        # minimum days between auto-retrains
  data_freshness_stale_days: 3    # days without data before "stale" status
  prediction_drift_ratio_threshold: 0.15  # ratio shift that signals pred drift

# ── Backtesting ───────────────────────────────────────────────────────────
backtest:
  default_initial_capital: 100000
  default_transaction_cost: 0.001
  default_slippage: 0.0005
  default_position_frac: 0.10
