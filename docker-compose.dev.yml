services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deps
    working_dir: /app/frontend
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["/bin/sh", "-c", "/app/scripts/init_db.sh && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    environment:
      APP_NAME: ${APP_NAME:-AlgoTrade Sentinel}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: development
      DEBUG: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DATABASE_URL: postgresql://algotrade:algotrade@db:5432/algotrade
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      ENABLE_APSCHEDULER: "false"
      GIT_PYTHON_REFRESH: quiet
      MPLCONFIGDIR: /tmp/matplotlib
      PREFECT_HOME: /tmp/.prefect
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./mlops:/app/mlops
      - ./config:/app/config
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_started

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotrade}
      POSTGRES_USER: ${POSTGRES_USER:-algotrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotrade}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algotrade} -d ${POSTGRES_DB:-algotrade}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command:
      [
        "/bin/sh", "-c",
        "mkdir -p /mlflow/artifacts && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlflow/artifacts"
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000').status < 500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prefect:
    image: prefecthq/prefect:2.19.9-python3.11
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect:4200/api}
    ports:
      - "4200:4200"

volumes:
  postgres_data:
  mlflow_artifacts:
